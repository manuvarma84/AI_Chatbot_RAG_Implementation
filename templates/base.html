<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
</head>
<body>
<div class="container">
    <div class="chatbox">
        <div class="chatbox__support">
            <div class="chatbox__header">
                <div class="chatbox__image--header">
                    <img src="{{ url_for('static', filename='images/Parker-Hannifin-Logo.ico') }}" width="20" height="20">
                </div>
                <div class="chatbox__content--header">
                    <h4 class="chatbox__heading--header">Chat</h4>
                    <p class="chatbox__description--header"></p>
                </div>
            </div>
            <!-- Chat Log where the messages will appear -->
            <div class="chatbox__messages">
                <!-- Typing indicator will be inserted here dynamically -->
            </div>
            <div class="chatbox__footer">
                <!-- Input field for the user to type messages -->
                <input type="text" id="userMessage" name="userMessage" placeholder="Write a message...">
                <!-- Button to send the message -->
                <button class="chatbox__send--footer send__button">                   
                    <img src="{{ url_for('static', filename='images/Send_Arrow.png') }}" width="30" height="30">
                </button>
                <!-- Button to view previous messages -->
                <button class="chatbox__prev--footer prev__button">
                    <img src="{{ url_for('static', filename='images/Prev_Arrow.png') }}" width="30" height="30">
                </button>
                <!-- Button to refresh/clear the chat -->
                <button class="chatbox__refresh--footer refresh__button">
                    <img src="{{ url_for('static', filename='images/Refresh_Arrow.png') }}" width="50" height="40">
                </button>                
            </div>
        </div>
    </div>
</div>

<!-- JavaScript file -->
<script type="text/javascript" src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
